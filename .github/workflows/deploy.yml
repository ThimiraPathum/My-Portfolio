name: Production Deployment 🚀

on:
  push:
    branches:
      - main

jobs:
  # GitHub compiles your React code for free on its own fast servers
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build Frontend
        run: |
          cd frontend
          npm ci
          echo "VITE_API_URL=/api" > .env.production
          npm run build

      - name: Upload Compiled Frontend Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # Your Azure server just downloads the assets and pulls the code changes
  deploy:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Frontend Dist Asset
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: main-dist

      - name: Copy Frontend Assets via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "main-dist/*"
          target: "/tmp/frontend-delivery"
          strip_components: 1

      - name: Run Lightning Fast Deployment Over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Update the codebase (Instantly updates backend files inside Docker via the volume link)
            cd ~/My-Portfolio
            git pull

            # 2. Deploy pre-built frontend files straight to Nginx
            sudo rm -rf /var/www/html/*
            sudo cp -r /tmp/frontend-delivery/* /var/www/html/
            sudo rm -rf /tmp/frontend-delivery

            # 3. Refresh Laravel internal caches so it registers your backend code modifications
            sudo docker exec backend-api php artisan config:clear
            sudo docker exec backend-api php artisan route:clear
            sudo docker exec backend-api php artisan view:clear
            
            # 4. Keep folder permissions synchronized for image uploads
            sudo docker exec backend-api chown -R www-data:www-data /app/storage /app/bootstrap/cache /var/data || true
