name: 🚀 Smart Portfolio Deployment Pro

on:
  push:
    branches:
      - main

env:
  DEPLOYMENT_USER: azureuser
  PROJECT_PATH: /home/azureuser/My-Portfolio

jobs:
  # ==========================================
  # STAGE 0: PRE-DEPLOYMENT CHECKS
  # ==========================================
  pre-deployment-check:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.time.outputs.timestamp }}
    steps:
      - name: Generate Deployment Timestamp
        id: time
        run: echo "timestamp=$(date '+%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: 📋 Log Deployment Start
        run: |
          echo "╔════════════════════════════════════╗"
          echo "║   PORTFOLIO DEPLOYMENT INITIATED   ║"
          echo "║   Timestamp: ${{ steps.time.outputs.timestamp }}"
          echo "║   Branch: main"
          echo "╚════════════════════════════════════╝"

  # ==========================================
  # STAGE 1: INTELLIGENT CHANGE DETECTION
  # ==========================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      has-changes: ${{ steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Detect File Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

      - name: 📊 Report Changes
        run: |
          echo "Frontend changed: ${{ steps.filter.outputs.frontend }}"
          echo "Backend changed: ${{ steps.filter.outputs.backend }}"

  # ==========================================
  # STAGE 2: FRONTEND COMPILATION & OPTIMIZATION
  # ==========================================
  frontend-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install Dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: 🏗️ Build Production Bundle
        run: |
          cd frontend
          echo "VITE_API_URL=/api" > .env.production
          npm run build

      - name: ✅ Verify Build Output
        run: |
          if [ ! -d "frontend/dist" ] || [ -z "$(ls -A frontend/dist)" ]; then
            echo "❌ Frontend build failed or dist is empty"
            exit 1
          fi
          echo "✅ Frontend build verified successfully"

      - name: 📦 Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ==========================================
  # STAGE 3: BACKEND CODE QUALITY CHECKS
  # ==========================================
  backend-validation:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, mbstring, xml
          tools: composer

      - name: 📥 Install Composer Dependencies
        run: |
          cd backend
          composer install --no-interaction --prefer-dist

      - name: 🔍 Run PHP Syntax Check
        run: |
          cd backend
          find app routes -name "*.php" -exec php -l {} \; | grep -E "^Parse error" && exit 1 || echo "✅ PHP syntax OK"

  # ==========================================
  # STAGE 4: ZERO-DOWNTIME DEPLOYMENT
  # ==========================================
  deploy:
    needs: [pre-deployment-check, detect-changes, frontend-build, backend-validation]
    if: always() && needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== FRONTEND DEPLOYMENT ==========
      - name: 📥 Download Frontend Artifact
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: 📤 Upload Frontend via SCP
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend-dist/*"
          target: "/tmp/frontend-delivery"
          strip_components: 1

      # ========== DEPLOYMENT EXECUTION ==========
      - name: 🚀 Execute Deployment Pipeline
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # Exit on any error
            
            # Color codes
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            YELLOW='\033[1;33m'
            BLUE='\033[0;34m'
            NC='\033[0m'
            
            echo -e "${BLUE}╔════════════════════════════════════════════════════╗${NC}"
            echo -e "${BLUE}║     🚀 DEPLOYMENT EXECUTION STARTED                ║${NC}"
            echo -e "${BLUE}║     Timestamp: $(date '+%Y-%m-%d %H:%M:%S')            ║${NC}"
            echo -e "${BLUE}╚════════════════════════════════════════════════════╝${NC}"
            
            # ========== SYNC SOURCE CODE ==========
            echo -e "${YELLOW}📥 Syncing Source Code from GitHub...${NC}"
            PROJECT_PATH="/home/azureuser/My-Portfolio"
            echo "DEBUG: PROJECT_PATH = ${PROJECT_PATH}"
            echo "DEBUG: Checking if .git exists:"
            ls -la "${PROJECT_PATH}/.git" || echo "ERROR: .git not found"
            echo "DEBUG: Current directory before pull:"
            pwd
            echo "DEBUG: Trying git pull..."
            /usr/bin/git -C "${PROJECT_PATH}" pull origin main --ff-only || {
            echo -e "${RED}❌ Git pull failed${NC}"
            exit 1
            }
            echo -e "${GREEN}✅ Source code synchronized${NC}"
            
            # ========== FRONTEND DEPLOYMENT ==========
            if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
              echo -e "${YELLOW}📦 Deploying Frontend Assets...${NC}"
              
              # Verify source exists
              if [ ! -d "/tmp/frontend-delivery" ]; then
                echo -e "${RED}❌ Frontend build artifacts not found${NC}"
                exit 1
              fi
              
              # Atomic swap with backup
              sudo rm -rf /var/www/html.backup
              [ -d "/var/www/html" ] && sudo mv /var/www/html /var/www/html.backup || true
              sudo mkdir -p /var/www/html
              sudo cp -r /tmp/frontend-delivery/* /var/www/html/
              
              # Set proper permissions
              sudo chown -R www-data:www-data /var/www/html
              sudo find /var/www/html -type d -exec chmod 755 {} +
              sudo find /var/www/html -type f -exec chmod 644 {} +
              
              # Cleanup
              sudo rm -rf /tmp/frontend-delivery
              
              echo -e "${GREEN}✅ Frontend deployed successfully${NC}"
            fi
            
            # ========== BACKEND DEPLOYMENT ==========
            if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
              echo -e "${YELLOW}⚙️  Deploying Backend...${NC}"
              
              # Check if Docker container is running
              if ! sudo docker ps | grep -q backend-api; then
                echo -e "${RED}❌ Backend container is not running${NC}"
                exit 1
              fi
              
              # ========== INSTALL DEPENDENCIES ==========
              echo -e "${YELLOW}   📥 Installing Composer dependencies...${NC}"
              
              # Remove vendor folder to ensure clean install
              sudo rm -rf "${PROJECT_PATH}/backend/vendor"
              
              # Install inside Docker container
              echo "   Installing composer dependencies..."
              sudo docker exec backend-api composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist || {
              echo -e "${RED}❌ Composer install failed${NC}"
              echo "Checking vendor folder:"
              sudo docker exec backend-api ls -la /app/vendor 2>&1 | head -20
              exit 1
                  }           

              #Verify vendor folder exists
              echo "   Verifying vendor folder..."
              sudo docker exec backend-api ls -la /app/vendor/autoload.php || {
              echo -e "${RED}❌ Vendor autoload not found!${NC}"
              exit 1
                }           
              echo -e "${GREEN}   ✅ Vendor folder verified${NC}"
              echo -e "${GREEN}   ✅ Dependencies installed${NC}"
              
              # ========== DATABASE MIGRATIONS (SAFE - keeps existing data) ==========
              echo -e "${YELLOW}   🔄 Running database migrations...${NC}"
              sudo docker exec backend-api php artisan migrate --force --no-interaction || {
                echo -e "${RED}❌ Migrations failed${NC}"
                exit 1
              }
              echo -e "${GREEN}   ✅ Migrations completed (existing data protected)${NC}"
              
              # ========== SMART SEEDING (only if database is empty) ==========
              echo -e "${YELLOW}   🌱 Checking if database seeding is needed...${NC}"
              
              # Count existing users to determine if database is populated
              USER_COUNT=$(sudo docker exec backend-api php artisan tinker --quiet --execute="echo \App\Models\User::count();" 2>/dev/null | tail -1 | tr -d ' ')
              
              if [ -z "$USER_COUNT" ]; then
                USER_COUNT=0
              fi
              
              if [ "$USER_COUNT" = "0" ]; then
                echo -e "${YELLOW}   📊 No users found - seeding database with initial data...${NC}"
                sudo docker exec backend-api php artisan db:seed --force --no-interaction || {
                  echo -e "${YELLOW}   ⚠️  Seeding failed or not configured, continuing without seed...${NC}"
                }
                echo -e "${GREEN}   ✅ Database seeded${NC}"
              else
                echo -e "${GREEN}   ✅ Database already populated with $USER_COUNT user(s) - skipping seed (your data is safe!)${NC}"
              fi
              
              # ========== CLEAR CACHES ==========
              echo -e "${YELLOW}   🧹 Clearing application cache...${NC}"
              sudo docker exec backend-api php artisan config:clear
              sudo docker exec backend-api php artisan route:clear
              sudo docker exec backend-api php artisan view:clear
              sudo docker exec backend-api php artisan cache:clear
              echo -e "${GREEN}   ✅ Cache cleared${NC}"
              
              # ========== FIX FILE PERMISSIONS ==========
              # ========== FIX FILE PERMISSIONS ==========
            echo -e "${YELLOW}   🔐 Setting file permissions...${NC}"
            sudo chown -R 33:33 "${PROJECT_PATH}/backend/storage" 2>/dev/null || true
            sudo chmod -R 775 "${PROJECT_PATH}/backend/storage" 2>/dev/null || true
              echo -e "${GREEN}   ✅ Permissions updated${NC}"
              
              echo -e "${GREEN}✅ Backend deployed successfully${NC}"
            fi
            
            # ========== HEALTH CHECKS ==========
            echo -e "${YELLOW}🏥 Running Health Checks...${NC}"
            
            # Check frontend
            if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
              FRONTEND_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
              if [ "$FRONTEND_CHECK" = "200" ] || [ "$FRONTEND_CHECK" = "301" ]; then
                echo -e "${GREEN}✅ Frontend is healthy (HTTP $FRONTEND_CHECK)${NC}"
              else
                echo -e "${RED}❌ Frontend health check failed (HTTP $FRONTEND_CHECK)${NC}"
                exit 1
              fi
            fi
            
            # Check backend
            if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
              BACKEND_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/api/settings || echo "000")
              if [ "$BACKEND_CHECK" = "200" ]; then
                echo -e "${GREEN}✅ Backend API is healthy (HTTP $BACKEND_CHECK)${NC}"
              else
                echo -e "${YELLOW}⚠️  Backend returned HTTP $BACKEND_CHECK (check logs if unexpected)${NC}"
              fi
            fi
            
            # ========== DEPLOYMENT COMPLETE ==========
            echo -e "${BLUE}╔════════════════════════════════════════════════════╗${NC}"
            echo -e "${GREEN}║        ✅ DEPLOYMENT COMPLETED SUCCESSFULLY        ║${NC}"
            echo -e "${BLUE}║     Timestamp: $(date '+%Y-%m-%d %H:%M:%S')            ║${NC}"
            echo -e "${BLUE}╚════════════════════════════════════════════════════╝${NC}"

      # ========== POST-DEPLOYMENT VERIFICATION ==========
      - name: ✅ Verify Deployment Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🔍 Final Deployment Verification..."
            echo ""
            echo "Docker containers status:"
            sudo docker ps -a --format "table {{.Names}}\t{{.Status}}"

  # ==========================================
  # STAGE 5: DEPLOYMENT NOTIFICATION
  # ==========================================
  notify-deployment:
    needs: [deploy, detect-changes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Deployment Summary
        run: |
          echo "╔════════════════════════════════════╗"
          echo "║      DEPLOYMENT SUMMARY REPORT     ║"
          echo "╠════════════════════════════════════╣"
          echo "║ Frontend Updated: ${{ needs.detect-changes.outputs.frontend }}"
          echo "║ Backend Updated:  ${{ needs.detect-changes.outputs.backend }}"
          echo "║ Status: ${{ needs.deploy.result }}"
          echo "║ Timestamp: $(date)"
          echo "╚════════════════════════════════════╝"

      - name: ❌ Notify on Failure
        if: needs.deploy.result == 'failure'
        run: |
          echo "⚠️  Deployment failed! Check GitHub Actions logs for details."
          exit 1

      - name: ✅ Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "Your existing data is safe and protected!"