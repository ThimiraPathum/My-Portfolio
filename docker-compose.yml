version: '3.8'

services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - portfolio-data:/var/data
      - portfolio-storage:/var/data/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/data/database.sqlite
      - LARAVEL_STORAGE_PATH=/var/data/storage
      - LOG_CHANNEL=stdout
      - PORT=80
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment}
      - APP_KEY=${APP_KEY:?Set APP_KEY in your environment}
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    networks:
      - portfolio-network
    restart: unless-stopped

volumes:
  portfolio-data:
    driver: local
  portfolio-storage:
    driver: local

networks:
  portfolio-network:
    driver: bridge