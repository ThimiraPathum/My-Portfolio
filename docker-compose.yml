version: '3.8'

services:
  # ==========================================
  # BACKEND SERVICE - Laravel API
  # ==========================================
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-api
    ports:
      - "8000:80"
    volumes:
      # Mount backend code for live changes
      - ./backend:/app
      # Persist database and storage
      - portfolio-data:/var/data
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/data/database.sqlite
      - LARAVEL_STORAGE_PATH=/var/data/storage
      - LOG_CHANNEL=stdout
      - PORT=80
    depends_on:
      - frontend
    networks:
      - portfolio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/settings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # FRONTEND SERVICE - Nginx Web Server
  # ==========================================
  frontend:
    image: nginx:alpine
    container_name: frontend-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Serve static frontend files
      - /var/www/html:/usr/share/nginx/html:ro
      # Nginx config (optional, create if needed)
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - portfolio-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# ==========================================
# VOLUMES - Persistent Storage
# ==========================================
volumes:
  portfolio-data:
    driver: local

# ==========================================
# NETWORKS - Service Communication
# ==========================================
networks:
  portfolio-network:
    driver: bridge
