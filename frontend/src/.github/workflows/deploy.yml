name: Autonomous Smart Deployment 🚀

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # STAGE 1: INTELLIGENT CHANGE DETECTION
  # ==========================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check file paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  # ==========================================
  # STAGE 2: CLOUD FRONTEND COMPILATION
  # ==========================================
  frontend-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build
        run: |
          cd frontend
          npm ci
          echo "VITE_API_URL=/api" > .env.production
          npm run build

      - name: Upload Compiled Dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ==========================================
  # STAGE 3: ZERO-DOWNTIME SERVER DELIVERY
  # ==========================================
  deploy:
    needs: [detect-changes, frontend-build]
    if: always() && (needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Transfer Frontend Assets (Only if changed)
      - name: Download Frontend Artifact
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: main-dist

      - name: Upload Frontend via SCP
        if: needs.detect-changes.outputs.frontend == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "main-dist/*"
          target: "/tmp/frontend-delivery"
          strip_components: 1

      # 2. Execute Server-Side Operations via SSH
      - name: Execute Live Environment Sync
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Starting Deployment Cycle..."
            
            # A. PULL LATEST SOURCE CODE (Instantly updates Docker via volume link)
            cd ~/My-Portfolio
            git pull origin main

            # B. PROCESS FRONTEND UPDATES
            if [ "${{ needs.detect-changes.outputs.frontend }}" = "true" ]; then
              echo "📦 Swapping Frontend Assets..."
              
              # Replace assets cleanly
              sudo rm -rf /var/www/html/*
              sudo cp -r /tmp/frontend-delivery/* /var/www/html/
              sudo rm -rf /tmp/frontend-delivery
              
              # Lock down Nginx permissions perfectly
              sudo chown -R www-data:www-data /var/www/html
              sudo find /var/www/html -type d -exec chmod 755 {} +
              sudo find /var/www/html -type f -exec chmod 644 {} +
              
              echo "✅ Frontend is LIVE."
            fi

            # C. PROCESS BACKEND UPDATES
            if [ "${{ needs.detect-changes.outputs.backend }}" = "true" ]; then
              echo "⚙️ Optimizing Backend Framework..."
              
              # Execute safe migrations and clear stale caches inside the container
              sudo docker exec backend-api php artisan migrate --force
              sudo docker exec backend-api php artisan config:clear
              sudo docker exec backend-api php artisan route:clear
              sudo docker exec backend-api php artisan view:clear
              
              # Guarantee database and storage folders maintain write access
              sudo chown -R 33:33 ~/My-Portfolio/database ~/My-Portfolio/backend/storage
              sudo chmod -R 775 ~/My-Portfolio/database ~/My-Portfolio/backend/storage
              
              echo "✅ Backend is LIVE."
            fi
            
            echo "🎉 DEPLOYMENT 100% COMPLETE!"
